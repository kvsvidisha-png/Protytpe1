<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediLoop Care | Dental Post-Care</title><style>
:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#193451;background:#f5f9ff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid #dbe7f6;position:sticky;top:0;z-index:2}.nav{max-width:1250px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850;color:#1455ae}.brand span{color:#20a2d5}.links{display:flex;gap:5px;flex-wrap:wrap}.links button{border:0;background:transparent;border-radius:8px;padding:9px 11px;color:#365779;font-size:13px;font-weight:650}.links button.active,.links button:hover{background:#e9f3ff;color:#1457b4}.container{max-width:1250px;margin:auto;padding:30px 20px 65px;min-height:75vh}h1{font-size:clamp(32px,5vw,58px);line-height:1.1;margin:12px 0 18px}h2{font-size:27px;margin:0 0 12px}h3{margin:0 0 12px}.muted{color:#617791;line-height:1.65}.hero{background:linear-gradient(115deg,#e1efff,#fff);padding:40px;border-radius:22px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.hero h1 span{color:#1b68c9}.herobox{text-align:center;background:#fff;border:1px solid #dce9f7;padding:26px;border-radius:20px}.heroicon{font-size:72px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1c62c2;color:white;font-weight:750}.btn.alt{background:#e8f2ff;color:#1554ad}.btn.line{background:white;border:1px solid #bcd5f4;color:#1554ad}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid #dce7f6;border-radius:16px;padding:22px;box-shadow:0 7px 25px #183c7210;min-width:0}.card p{line-height:1.6}.stat strong{display:block;font-size:30px;color:#1b65c5}.stat span{color:#637b96;font-size:13px}.tag{display:inline-block;background:#e8f2ff;color:#195caf;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;font-size:13px;font-weight:700;color:#36516d}.field input,.field textarea,.field select{border:1px solid #cbdcf0;background:white;border-radius:9px;padding:11px;width:100%;color:#203d5b}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.item{padding:15px 0;border-bottom:1px solid #e4edf8}.item:last-child{border:0}.item p{margin:8px 0}.note{background:#fff4dc;color:#835719;padding:12px;border-radius:9px;font-size:13px;line-height:1.5}.empty{padding:25px;border:1px dashed #c8d9ef;border-radius:10px;text-align:center;color:#69809b}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.subtabs button{padding:9px 13px;border:1px solid #cfdded;border-radius:8px;background:white;color:#315779;font-weight:700}.subtabs button.active{background:#1d62c3;color:white;border-color:#1d62c3}.toast{position:fixed;bottom:22px;right:22px;background:#174477;color:white;padding:13px 18px;border-radius:10px;z-index:10;max-width:400px;box-shadow:0 10px 35px #123e6d44}.footer{background:#12386e;color:#dce9fb;padding:22px;text-align:center;font-size:12px}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#e9f3ff;color:#1c5cb4;font-size:12px;font-weight:700}.splitrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.smallmuted{font-size:12px;color:#69809b}.danger{color:#a33737}.progress{height:8px;background:#e5effa;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#2d80d2}@media(max-width:800px){.hero{grid-template-columns:1fr}.grid.four,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.hero{padding:24px}.grid,.grid.two,.grid.four,.formgrid{grid-template-columns:1fr}.nav{padding:12px}.links button{font-size:12px;padding:7px}.container{padding:18px 13px 40px}}
</style></head><body><div class="top"><div class="nav"><div class="brand">✚ MediLoop<span>Care</span><div style="font-size:10px;font-weight:500;color:#6d829c;letter-spacing:1px">BEYOND TREATMENT. BESIDE RECOVERY.</div></div><div class="links" id="nav"></div></div></div><main id="app" class="container"></main><footer class="footer">MediLoop Care · Offline interactive prototype with care assistant · Fictional demo data only · Not for real clinical use</footer><div id="toast" class="toast" role="status" hidden></div><script>
'use strict';
const S=['Orthodontics','Conservative Dentistry & Endodontics','Periodontology','Prosthodontics','Oral & Maxillofacial Surgery','Pediatric & Preventive Dentistry','Oral Medicine & Radiology','Oral Pathology & Microbiology'];
const initial=()=>({dentists:[{id:'d1',name:'Dr. Asha Rao (Demo)',registration:'DEMO-001',qualification:'MDS',specialty:S[1],clinic:'BlueCare Dental Studio',location:'Banjara Hills, Hyderabad',days:'Mon–Sat',hours:'09:00–17:00'},{id:'d2',name:'Dr. Arjun Mehta (Demo)',registration:'DEMO-002',qualification:'MDS',specialty:S[0],clinic:'SmileLine Dental',location:'Madhapur, Hyderabad',days:'Mon–Fri',hours:'10:00–18:00'},{id:'d3',name:'Dr. Kavya Nair (Demo)',registration:'DEMO-003',qualification:'MDS',specialty:S[4],clinic:'CareBridge Dental',location:'Kondapur, Hyderabad',days:'Tue–Sat',hours:'09:00–16:00'}],patients:[{id:'p1',name:'Ananya Sharma (Demo)',age:26,contact:'Demo only'},{id:'p2',name:'Rahul Verma (Demo)',age:34,contact:'Demo only'}],plans:[{id:'c1',patientId:'p1',dentistId:'d1',treatment:'Root Canal Treatment',date:'2026-11-18',followup:'2026-11-25',instructions:'Follow your dentist’s instructions. Avoid chewing on the treated tooth until advised. Contact your dentist for worsening pain or swelling.',medication:'Use only medicines prescribed by your dentist.',status:'Active'}],updates:[{id:'u1',patientId:'p1',date:'2026-11-19',pain:3,swelling:'Mild',notes:'Mild sensitivity, otherwise comfortable.'}],appointments:[{id:'a1',patientId:'p1',dentistId:'d1',date:'2026-11-25',time:'11:00',status:'Scheduled'}]});
const KEY='mediloopcare_demo_v3';let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!db.dentists||!db.patients||!db.plans||!db.updates||!db.appointments)db=initial()}catch{db=initial()}
let page='home',sub='patients',selected='p1',search='',specialty='All';const $=s=>document.querySelector(s),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Browser storage is unavailable; changes will last only until refresh.')}};const doctor=id=>db.dentists.find(x=>x.id===id);const patient=id=>db.patients.find(x=>x.id===id);const options=(arr,value)=>arr.map(x=>{const v=typeof x==='string'?x:x.id,t=typeof x==='string'?x:x.name;return `<option value="${escapeHTML(v)}" ${v===value?'selected':''}>${escapeHTML(t)}</option>`}).join('');const go=(name)=>{page=name;render();window.scrollTo(0,0)};function notify(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(window.mlcTimer);window.mlcTimer=setTimeout(()=>el.hidden=true,3800)};const btn=(text,target,cls='')=>`<button class="btn ${cls}" data-page="${target}">${text}</button>`;const heading=(h,p)=>`<h2>${h}</h2><p class="muted">${p}</p>`;
function home(){return `<section class="hero"><div><span class="tag">🦷 DENTAL POST-TREATMENT CARE</span><h1>Treatment ends.<br><span>Care continues.</span></h1><p class="muted" style="font-size:17px">A connected recovery journey for dentists and patients. Create aftercare plans, record symptoms, review recovery progress and coordinate follow-up appointments.</p><div class="actions">${btn('Dentist Dashboard','dentist')}${btn('Patient Portal','patient','line')}</div><p class="smallmuted">✓ Eight specializations &nbsp; ✓ Recovery monitoring &nbsp; ✓ Follow-up scheduling</p></div><div class="herobox"><div class="heroicon">🦷</div><h3>Your recovery journey</h3><div class="item">1. Treatment recorded</div><div class="item">2. Post-care plan created</div><div class="item">3. Daily patient check-ins</div><div class="item">4. Dentist reviews progress</div><div class="item">5. Follow-up completed</div></div></section><div class="grid four">${[['Dentists',db.dentists.length],['Patients',db.patients.length],['Active Care Plans',db.plans.filter(x=>x.status==='Active').length],['Follow-ups',db.appointments.filter(x=>x.status==='Scheduled').length]].map(([k,v])=>`<div class="card stat"><strong>${v}</strong><span>${k}</span></div>`).join('')}</div><section style="margin-top:30px">${heading('Post-care in one place','A simple workflow for both the dental team and recovering patients.')}<div class="grid">${[['🩺','Dentist Care Plans','Create treatment-specific instructions, medication notes and review schedules.'],['💙','Recovery Tracking','Record daily pain, swelling and symptoms in the patient portal.'],['📅','Follow-up Visits','Book, review and cancel demonstration follow-up appointments.']].map(([i,t,d])=>`<div class="card"><div style="font-size:28px">${i}</div><h3>${t}</h3><p class="muted">${d}</p></div>`).join('')}</div></section><section style="margin-top:30px">${heading('Eight dental specializations','Specialty profiles for dental post-treatment care.')}<div class="grid four">${S.map((x,i)=>`<div class="card"><span class="pill">${i+1}</span><h3 style="margin-top:12px">${escapeHTML(x)}</h3></div>`).join('')}</div></section>`}
function directory(){const matches=db.dentists.filter(d=>(specialty==='All'||d.specialty===specialty)&&[d.name,d.clinic,d.location,d.specialty].join(' ').toLowerCase().includes(search.toLowerCase()));return `${heading('Dentist Directory','Browse fictional dentists and their clinic hours.')}<div class="grid two"><label class="field">Search doctor, clinic or location<input id="search" value="${escapeHTML(search)}" placeholder="Search..."></label><label class="field">Specialization<select id="specialty">${options(['All',...S],specialty)}</select></label></div><div class="grid">${matches.map(d=>`<div class="card"><div style="font-size:32px">👩‍⚕️</div><h3>${escapeHTML(d.name)}</h3><span class="tag">${escapeHTML(d.specialty)}</span><p class="muted"><b>${escapeHTML(d.clinic)}</b><br>📍 ${escapeHTML(d.location)}<br>🕒 ${escapeHTML(d.days)} · ${escapeHTML(d.hours)}</p>${btn('Book Follow-up','appointments')}</div>`).join('')||'<div class="empty">No matching dentists found.</div>'}</div>`}
function register(){return `${heading('Dentist Registration','Create a fictional dentist profile in the demo directory.')}<div class="card" style="max-width:780px"><form id="dentistForm"><div class="formgrid"><label class="field">Full Name<input name="name" placeholder="Dr. Full Name" required></label><label class="field">Dental Council Registration No.<input name="registration" required></label><label class="field">Qualification<input name="qualification" placeholder="BDS / MDS" required></label><label class="field">Specialization<select name="specialty">${options(S)}</select></label><label class="field">Clinic Name<input name="clinic" required></label><label class="field">Clinic Location<input name="location" placeholder="Area, City" required></label><label class="field">Working Days<input name="days" placeholder="Mon–Sat" required></label><label class="field">Consultation Hours<input name="hours" placeholder="09:00–17:00" required></label></div><p class="note">Demo only. Registration does not verify professional credentials. Please use fictional information.</p><button class="btn" type="submit">Register Dentist</button></form></div>`}
function dentist(){return `${heading('Dentist Dashboard','Add patients, create aftercare plans and review recovery progress.')}<div class="grid four">${[['Patients',db.patients.length],['Active Plans',db.plans.filter(x=>x.status==='Active').length],['Recovery Check-ins',db.updates.length],['Scheduled Visits',db.appointments.filter(x=>x.status==='Scheduled').length]].map(([k,v])=>`<div class="card stat"><strong>${v}</strong><span>${k}</span></div>`).join('')}</div><div class="subtabs">${[['patients','Patients'],['plans','Care Plans'],['updates','Recovery Updates']].map(([id,t])=>`<button data-sub="${id}" class="${sub===id?'active':''}">${t}</button>`).join('')}</div>${sub==='patients'?dentistPatients():sub==='plans'?dentistPlans():dentistUpdates()}`}
function dentistPatients(){return `<div class="grid two"><div class="card"><h3>Add Patient</h3><form id="patientForm"><label class="field">Patient Name<input name="name" required></label><label class="field">Age<input name="age" type="number" min="1" max="120" required></label><label class="field">Contact (fictional)<input name="contact"></label><button class="btn">Add Patient</button></form></div><div class="card"><h3>Patient Directory</h3>${db.patients.map(p=>`<div class="item"><strong>${escapeHTML(p.name)}</strong><p class="smallmuted">Age ${p.age} · ${db.plans.filter(x=>x.patientId===p.id).length} care plans</p><button class="btn small alt" data-patient="${p.id}">Open Patient Portal</button></div>`).join('')}</div></div>`}
function dentistPlans(){return `<div class="grid two"><div class="card"><h3>Create Post-Care Plan</h3><form id="planForm"><label class="field">Patient<select name="patientId">${options(db.patients)}</select></label><label class="field">Dentist<select name="dentistId">${options(db.dentists)}</select></label><label class="field">Treatment / Procedure<input name="treatment" placeholder="e.g. Root Canal" required></label><div class="formgrid"><label class="field">Treatment Date<input name="date" type="date" required></label><label class="field">Follow-up Date<input name="followup" type="date" required></label></div><label class="field">Post-Care Instructions<textarea name="instructions" required></textarea></label><label class="field">Medication Notes<textarea name="medication" placeholder="Only clinician-authorized instructions"></textarea></label><button class="btn">Save Care Plan</button></form></div><div class="card"><h3>Care Plans</h3>${db.plans.map(p=>`<div class="item"><strong>${escapeHTML(patient(p.patientId)?.name)} — ${escapeHTML(p.treatment)}</strong><p class="muted">${escapeHTML(doctor(p.dentistId)?.name)}<br>Follow-up: ${escapeHTML(p.followup)}</p><span class="pill">${escapeHTML(p.status)}</span> ${p.status==='Active'?`<button class="btn small line" data-complete="${p.id}">Mark Completed</button>`:''}</div>`).join('')||'<div class="empty">No care plans yet.</div>'}</div></div>`}
function dentistUpdates(){return `<div class="card"><h3>Recovery Check-ins</h3>${[...db.updates].reverse().map(u=>`<div class="item"><div class="splitrow"><strong>${escapeHTML(patient(u.patientId)?.name)}</strong><span class="pill">Pain ${u.pain}/10</span></div><p class="smallmuted">${escapeHTML(u.date)} · Swelling: ${escapeHTML(u.swelling)}</p><p>${escapeHTML(u.notes)}</p>${u.pain>=7||u.swelling==='Severe'?'<div class="note">⚠ Potential concern: arrange prompt professional assessment. This demo does not send real alerts.</div>':''}</div>`).join('')||'<div class="empty">No recovery updates yet.</div>'}</div>`}
function portal(){const p=patient(selected)||db.patients[0];if(!p)return '<div class="empty">Add a patient in the dentist dashboard first.</div>';selected=p.id;const plans=db.plans.filter(x=>x.patientId===selected),updates=db.updates.filter(x=>x.patientId===selected);return `${heading('Patient Recovery Portal','Review care instructions and submit a recovery check-in.')}<div class="card" style="margin-bottom:16px"><label class="field" style="max-width:350px">Choose Demo Patient<select id="patientSwitch">${options(db.patients,selected)}</select></label><h3>Welcome, ${escapeHTML(p.name)}</h3><p class="muted">Your dental recovery information is below.</p></div><div class="grid two"><div class="card"><h3>My Post-Care Plans</h3>${plans.map(c=>`<div class="item"><span class="pill">${escapeHTML(c.status)}</span><h3 style="margin-top:12px">${escapeHTML(c.treatment)}</h3><p><b>Treatment:</b> ${escapeHTML(c.date)}<br><b>Follow-up:</b> ${escapeHTML(c.followup)}<br><b>Dentist:</b> ${escapeHTML(doctor(c.dentistId)?.name)}</p><p><b>Aftercare Instructions</b><br>${escapeHTML(c.instructions)}</p><p><b>Medication Notes</b><br>${escapeHTML(c.medication)}</p></div>`).join('')||'<div class="empty">No care plan assigned.</div>'}</div><div class="card"><h3>Daily Recovery Check-in</h3><form id="checkinForm"><label class="field">Pain Level: <span id="painText">3 / 10</span><input id="painRange" name="pain" type="range" min="0" max="10" value="3"></label><label class="field">Swelling<select name="swelling">${options(['None','Mild','Moderate','Severe'])}</select></label><label class="field">Symptoms / Recovery Notes<textarea name="notes" required></textarea></label><button class="btn">Submit Check-in</button></form><p class="note">Severe or rapidly worsening symptoms need prompt clinical assessment. Breathing difficulties, swallowing difficulties or uncontrolled bleeding may require emergency care. This demo is not monitored.</p></div></div><div class="card" style="margin-top:16px"><h3>Recovery History</h3>${[...updates].reverse().map(u=>`<div class="item"><div class="splitrow"><strong>${escapeHTML(u.date)}</strong><span class="pill">Pain ${u.pain}/10</span></div><p class="smallmuted">Swelling: ${escapeHTML(u.swelling)}</p><p>${escapeHTML(u.notes)}</p><div class="progress"><div style="width:${u.pain*10}%"></div></div></div>`).join('')||'<div class="empty">No check-ins submitted.</div>'}</div>`}
function appointments(){return `${heading('Follow-up Appointments','Book and manage demonstration review visits.')}<div class="grid two"><div class="card"><h3>Book Follow-up</h3><form id="appointmentForm"><label class="field">Patient<select name="patientId">${options(db.patients,selected)}</select></label><label class="field">Dentist<select name="dentistId">${options(db.dentists)}</select></label><div class="formgrid"><label class="field">Appointment Date<input name="date" type="date" required></label><label class="field">Time<input name="time" type="time" required></label></div><p class="smallmuted">Choose a time within the clinic's published demo hours. No real appointment is reserved.</p><button class="btn">Book Follow-up</button></form></div><div class="card"><h3>Appointment List</h3>${db.appointments.map(a=>`<div class="item"><div class="splitrow"><strong>${escapeHTML(patient(a.patientId)?.name)}</strong><span class="pill">${escapeHTML(a.status)}</span></div><p class="muted">${escapeHTML(doctor(a.dentistId)?.name)}<br>${escapeHTML(a.date)} at ${escapeHTML(a.time)}</p>${a.status==='Scheduled'?`<button class="btn small line" data-cancel="${a.id}">Cancel</button>`:''}</div>`).join('')||'<div class="empty">No appointments booked.</div>'}</div></div>`}

function assistant(){const p=db.patients.find(x=>x.id===selected),plan=db.plans.filter(x=>x.patientId===selected).at(-1),updates=db.updates.filter(x=>x.patientId===selected);return `${heading('MediLoop Care Assistant','A rule-based demonstration assistant for aftercare questions. It is not a clinical AI or emergency service.')}<div class="grid two"><div class="card"><label class="field">Demo patient<select id="assistantPatient">${options(db.patients,selected)}</select></label><div class="note">This assistant reads the selected fictional patient’s saved care plan and check-ins. It does not diagnose or prescribe treatment.</div><div class="actions"><button class="btn alt small" data-ask="What are my care instructions?">Care instructions</button><button class="btn alt small" data-ask="When is my follow-up?">Follow-up date</button><button class="btn alt small" data-ask="Show recovery summary">Recovery summary</button><button class="btn alt small" data-ask="What medications were noted?">Medication notes</button></div><form id="assistantForm"><label class="field" style="margin-top:20px">Ask a post-care question<textarea name="question" placeholder="e.g. What does my care plan say about recovery?" required></textarea></label><button class="btn" type="submit">Send question</button></form></div><div class="card"><h3>Care Assistant Conversation</h3><div id="assistantMessages" aria-live="polite" style="max-height:410px;overflow:auto"><div class="item"><span class="tag">Care Assistant</span><p>Welcome, ${escapeHTML(p?.name||'patient')}. Ask about your care plan, follow-up date or recorded recovery updates.</p></div></div></div></div>`}
function assistantReply(question){const q=question.toLowerCase(),plan=db.plans.filter(x=>x.patientId===selected).at(-1),updates=db.updates.filter(x=>x.patientId===selected),last=updates.at(-1),appts=db.appointments.filter(a=>a.patientId===selected&&a.status==='Scheduled');if(/breath|swallow|uncontrolled bleed|heavy bleed|face swelling rapidly|rapid swelling/.test(q))return 'Seek emergency medical care now for difficulty breathing or swallowing, uncontrolled bleeding, or rapidly increasing swelling. This chat cannot contact emergency services.';if(/severe pain|fever|pus|worsening swelling|infection/.test(q))return 'These symptoms need prompt assessment by your treating dentist or an urgent dental service. Do not rely on this demo assistant for diagnosis.';if(/instruction|care plan|aftercare|what should i do/.test(q))return plan?'Your dentist-entered instructions: '+plan.instructions:'No post-care plan is recorded for this demo patient.';if(/medic|prescri|tablet|drug/.test(q))return plan?'Dentist-entered medication notes: '+(plan.medication||'No medication notes recorded.')+' Follow your dentist’s prescription only.':'No medication information is recorded.';if(/follow.?up|appointment|review|visit/.test(q))return 'Plan follow-up: '+(plan?.followup||'not recorded')+'. Scheduled demo appointments: '+(appts.map(a=>a.date+' at '+a.time).join('; ')||'none')+'.';if(/pain|swelling|progress|recovery|summary|check.?in/.test(q))return last?'Most recent recorded check-in: '+last.date+', pain '+last.pain+'/10, swelling '+last.swelling+'. Notes: '+last.notes+'. This is a record summary, not an assessment.':'No recovery check-ins are recorded yet.';return 'I can retrieve care instructions, medication notes, recovery check-ins and follow-up dates. For personalized clinical questions, contact your treating dentist.'}
function askAssistant(q){const area=$('#assistantMessages');if(!area)return;area.insertAdjacentHTML('beforeend','<div class="item"><span class="tag">You</span><p>'+escapeHTML(q)+'</p></div><div class="item"><span class="tag">Care Assistant</span><p>'+escapeHTML(assistantReply(q))+'</p></div>');area.scrollTop=area.scrollHeight}

function render(){const pages=[['home','Home'],['directory','Find Dentists'],['register','Dentist Registration'],['dentist','Dentist Dashboard'],['patient','Patient Portal'],['appointments','Appointments'],['assistant','Care Assistant']];$('#nav').innerHTML=pages.map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${label}</button>`).join('');$('#app').innerHTML=({home,directory,register,dentist,patient:portal,appointments,assistant}[page]||home)()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.ask){askAssistant(b.dataset.ask);return}if(b.dataset.sub){sub=b.dataset.sub;render();return}if(b.dataset.patient){selected=b.dataset.patient;go('patient');return}if(b.dataset.complete){const p=db.plans.find(x=>x.id===b.dataset.complete);if(p){p.status='Completed';save();render();notify('Care plan completed')}return}if(b.dataset.cancel){const a=db.appointments.find(x=>x.id===b.dataset.cancel);if(a){a.status='Cancelled';save();render();notify('Appointment cancelled')}}});
document.addEventListener('input',e=>{if(e.target.id==='painRange')$('#painText').textContent=e.target.value+' / 10';if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const inp=$('#search');inp.focus();inp.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='specialty'){specialty=e.target.value;render()}if(e.target.id==='patientSwitch'||e.target.id==='assistantPatient'){selected=e.target.value;render()}});
document.addEventListener('submit',e=>{if(!e.target.id)return;e.preventDefault();const form=e.target,fd=new FormData(form),g=k=>String(fd.get(k)||'').trim();if(form.id==='assistantForm'){askAssistant(g('question'));form.reset();return}if(form.id==='dentistForm'){db.dentists.push({id:uid(),name:g('name'),registration:g('registration'),qualification:g('qualification'),specialty:g('specialty'),clinic:g('clinic'),location:g('location'),days:g('days'),hours:g('hours')});save();go('directory');notify('Demo dentist registered successfully')}
else if(form.id==='patientForm'){db.patients.push({id:uid(),name:g('name'),age:Number(g('age')),contact:g('contact')});save();render();notify('Patient added')}
else if(form.id==='planForm'){if(g('followup')<g('date')){notify('Follow-up date must be on or after treatment');return}db.plans.push({id:uid(),patientId:g('patientId'),dentistId:g('dentistId'),treatment:g('treatment'),date:g('date'),followup:g('followup'),instructions:g('instructions'),medication:g('medication'),status:'Active'});save();render();notify('Post-care plan created')}
else if(form.id==='checkinForm'){db.updates.push({id:uid(),patientId:selected,date:new Date().toLocaleDateString('en-CA'),pain:Number(g('pain')),swelling:g('swelling'),notes:g('notes')});save();render();notify('Recovery check-in saved')}
else if(form.id==='appointmentForm'){const date=g('date'),time=g('time'),dentistId=g('dentistId');if(db.appointments.some(a=>a.date===date&&a.time===time&&a.dentistId===dentistId&&a.status==='Scheduled')){notify('That dentist time slot is already booked');return}db.appointments.push({id:uid(),patientId:g('patientId'),dentistId,date,time,status:'Scheduled'});save();render();notify('Demo follow-up booked')}});
render();
</script></body></html>
